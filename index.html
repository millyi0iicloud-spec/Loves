<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12050c">
<title>Для тебя ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --rose: #ff4d79; --rose2: #ff8fab; --text: #fff0f4; --hint: #d9a3b3; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
    background: linear-gradient(160deg, #12050c, #2b0a1c);
    font: 17px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body.night { background: radial-gradient(circle at 50% 30%, #2a0620, #08020a 72%); }
  body.night .warn, body.night .bg { display: none; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; animation: drift 18s ease-in-out infinite alternate; }
  .b1 { width: 340px; height: 340px; background: #ff2d6f; top: -90px; left: -110px; }
  .b2 { width: 320px; height: 320px; background: #b0166b; bottom: -80px; right: -100px; animation-delay: -7s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.25); } }

  .warn { position: relative; z-index: 3; display: flex; justify-content: center; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0; }
  .warn span {
    padding: 10px 18px; border-radius: 999px; font-weight: 700; color: #ffd5df; text-align: center;
    background: rgba(255, 60, 110, .16); border: 1px solid rgba(255, 120, 150, .5);
    box-shadow: 0 0 24px rgba(255, 60, 110, .35); animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow { 50% { box-shadow: 0 0 40px rgba(255, 60, 110, .65); } }

  main { position: relative; z-index: 2; max-width: 460px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card {
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); border-radius: 26px;
    padding: 24px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    animation: in .6s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }

  h1 {
    font-family: "Playfair Display", Georgia, serif; font-size: 28px; line-height: 1.2; margin: 6px 0 10px;
    background: linear-gradient(90deg, #fff, var(--rose2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0 0 12px; color: #f6dbe3; }
  .hud { display: flex; justify-content: space-between; align-items: center; color: var(--hint); font-size: 14px; }
  .dots { display: flex; gap: 3px; font-size: 14px; }
  .dots span { color: rgba(255, 255, 255, .18); }
  .dots span.on { color: var(--rose); text-shadow: 0 0 8px var(--rose); }

  .opts { display: grid; gap: 12px; margin-top: 16px; }
  button.opt, button.main {
    font: inherit; width: 100%; padding: 15px 16px; border-radius: 16px; cursor: pointer; color: var(--text);
    border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .08);
    transition: transform .15s, background .2s;
  }
  button.opt:hover { background: rgba(255, 255, 255, .16); }
  button.opt:active, button.main:active { transform: scale(.97); }
  button.main { font-weight: 700; border: 0; margin-top: 8px; background: linear-gradient(135deg, #ff4d79, #ff2d6f 55%, #ff7a59); box-shadow: 0 8px 26px rgba(255, 60, 110, .5); }
  input.num {
    width: 100%; margin: 16px 0 4px; padding: 15px; font: inherit; font-size: 24px; text-align: center; color: var(--text);
    background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .25); border-radius: 16px;
  }
  .err { color: #ff8fab; font-weight: 600; min-height: 1.5em; margin: 12px 0 0; }
  .ok { color: #ffd0dc; font-weight: 700; margin: 12px 0 0; }
  .hint { color: var(--hint); font-size: 15px; margin: 4px 0 0; }
  .count { text-align: center; color: var(--hint); margin: 10px 0 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--rose2); outline-offset: 2px; }
  .link { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--hint); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }

  /* Игровые поля */
  .area { position: relative; height: 260px; margin-top: 14px; overflow: hidden; border-radius: 18px; background: rgba(0, 0, 0, .22); border: 1px dashed rgba(255, 255, 255, .22); }
  .fh { position: absolute; padding: 6px; line-height: 1; background: none; border: 0; color: var(--rose); cursor: pointer; touch-action: manipulation; text-shadow: 0 0 14px var(--rose); transition: left 1.2s linear, top 1.2s linear; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .mc { aspect-ratio: 1; font-size: 30px; border-radius: 14px; cursor: pointer; color: inherit; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .08); }
  .mc.up { background: rgba(255, 77, 121, .28); }
  .big { display: block; margin: 14px auto 0; width: 150px; height: 150px; font-size: 80px; line-height: 1; border-radius: 50%; cursor: pointer; border: 0; background: radial-gradient(circle, rgba(255, 200, 80, .28), transparent 70%); touch-action: manipulation; transition: transform .1s; }
  .big:active { transform: scale(.88) rotate(-6deg); }
  .bar { height: 8px; border-radius: 8px; margin-top: 16px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--rose2)); }
  .holdbtn { display: block; margin: 18px auto 0; width: 150px; height: 150px; border-radius: 50%; font: inherit; font-weight: 700; color: #fff; cursor: pointer; border: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: radial-gradient(circle at 35% 30%, #ff8fab, #e11d48); box-shadow: 0 0 30px rgba(255, 60, 110, .6); transition: transform .2s, box-shadow .2s; }
  .holdbtn.on { transform: scale(1.12); box-shadow: 0 0 60px rgba(255, 60, 110, 1); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 46px; margin: 22px 0 6px; background: transparent; touch-action: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(255, 77, 121, .25), rgba(255, 143, 171, .5)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 46px; height: 46px; margin-top: -17px; border-radius: 50%; border: 0; background: radial-gradient(circle at 35% 30%, #ff8fab, #e11d48); box-shadow: 0 0 20px rgba(255, 60, 110, .8); }
  input[type=range]::-moz-range-track { height: 12px; border-radius: 12px; background: rgba(255, 77, 121, .35); }
  input[type=range]::-moz-range-thumb { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #e11d48; }

  /* Финал: неоновое сердце */
  .neon { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 12px; }
  .hw { position: relative; width: min(80vw, 340px); margin-bottom: 18px; }
  .hw::before { content: ""; position: absolute; inset: -25%; background: radial-gradient(circle, rgba(255, 46, 147, .38), transparent 62%); opacity: 0; animation: fadein 2s 3s forwards; }
  .hw svg { position: relative; display: block; width: 100%; height: auto; overflow: visible; animation: flick 1.3s 3.3s both, pulse 2.8s 4.6s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px #ff2e93) drop-shadow(0 0 26px #ff0f7b); }
  .hw path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3s ease-in-out forwards; }
  .hw .glow { stroke: #ff1f8f; stroke-width: 3.2; opacity: .9; }
  .hw .core { stroke: #ffe6f4; stroke-width: .9; }
  .hw .e2 { animation-delay: .7s; }
  .hw .fillh { fill: #ff2e93; stroke: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0; animation: fillin 1.6s 3.2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fillin { to { opacity: .17; } }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes flick { 0% { opacity: 1; } 6% { opacity: .25; } 12% { opacity: 1; } 20% { opacity: .4; } 27% { opacity: 1; } 40% { opacity: .7; } 48%, 100% { opacity: 1; } }
  @keyframes pulse { from { filter: drop-shadow(0 0 6px #ff2e93) drop-shadow(0 0 20px #ff0f7b); } to { filter: drop-shadow(0 0 12px #ff5aa8) drop-shadow(0 0 46px #ff0f7b); } }
  .wd { opacity: 0; transform: translateY(12px); margin: 0 0 12px; font-family: "Playfair Display", Georgia, serif; font-size: 21px; line-height: 1.35; color: #ffe3ef; text-shadow: 0 0 14px rgba(255, 46, 147, .7); animation: rise 1.1s ease forwards; }
  .wd.last { font-size: 28px; color: #ff9bc8; text-shadow: 0 0 10px #ff2e93, 0 0 28px #ff0f7b; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .fl { position: fixed; bottom: -40px; z-index: 1; pointer-events: none; opacity: 0; animation: fly linear forwards; text-shadow: 0 0 12px currentColor; }
  @keyframes fly { 0% { opacity: 0; transform: translate(0, 0); } 10% { opacity: .55; } 100% { opacity: 0; transform: translate(30px, -112vh); } }
  .bst { position: fixed; z-index: 9; pointer-events: none; font-size: 20px; animation: bst .9s ease-out forwards; }
  @keyframes bst { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); } }
  @media (prefers-reduced-motion: reduce) {
    .card, .shake, .warn span { animation: none; } .fl, .bst { display: none; } .fh { transition: none; }
    .hw path { animation: none; stroke-dashoffset: 0; } .hw .fillh { animation: none; opacity: .17; } .hw svg, .hw::before { animation: none; opacity: 1; } .wd { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i></div>
<div class="warn"><span>⚠️ Внимание: ошибки не принимаются!</span></div>
<main id="app"></main>

<script>
  // ===== Настройки: поменяй под себя =====
  var CONFIG = {
    name: "любимая",                 // как к ней обращаться
    start: "2024-03-15",             // дата начала отношений (ГГГГ-ММ-ДД)
    // Слова в финале (последняя строка «Я люблю тебя, …» добавится сама)
    words: [
      "Ты мой самый любимый человек.",
      "С тобой любой день становится особенным.",
      "Спасибо, что ты рядом."
    ]
  };

  var ERRORS = ["Ошибки не принимаются 😤 Попробуй ещё раз", "Нет-нет-нет, так не пойдёт ❌", "Ну подумай получше 😏"];
  var PALETTE = ["#ff2d55", "#ff6b8b", "#ff9eb5", "#e11d48", "#ff7aa2", "#ffc2d1"];

  var app = document.getElementById("app");
  var cleanup = null, lastX = innerWidth / 2, lastY = innerHeight / 2;
  document.addEventListener("pointerdown", function (e) { lastX = e.clientX; lastY = e.clientY; });

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function clear() { if (cleanup) { cleanup(); cleanup = null; } document.body.classList.remove("night"); app.replaceChildren(); }

  function startDate() { var p = CONFIG.start.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function fmtDate(d) { return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); }
  function daysTogether() {
    var p = CONFIG.start.split("-").map(Number), n = new Date();
    return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(p[0], p[1] - 1, p[2])) / 86400000);
  }

  function burst(x, y) {
    for (var i = 0; i < 12; i++) {
      var h = el("span", "bst", "♥"), a = Math.random() * 6.28, d = 50 + Math.random() * 70;
      h.style.left = x + "px"; h.style.top = y + "px";
      h.style.setProperty("--dx", Math.cos(a) * d + "px"); h.style.setProperty("--dy", Math.sin(a) * d + "px");
      h.style.color = PALETTE[(Math.random() * PALETTE.length) | 0];
      h.addEventListener("animationend", function () { this.remove(); });
      document.body.appendChild(h);
    }
  }

  // ===== Уровни: каждый получает (box, win, fail, hint) и может вернуть функцию очистки =====
  function choiceLevel(choices, ok, dodge) {
    return function (box, win, fail) {
      var opts = el("div", "opts");
      choices.forEach(function (label, k) {
        var b = el("button", "opt", label);
        if (dodge.indexOf(k) >= 0) {            // «неправильные» кнопки убегают от пальца
          b.addEventListener("pointerenter", function () {
            b.style.transform = "translate(" + rand(-26, 26) + "px," + rand(-70, 70) + "px)";
          });
        }
        b.onclick = function () { ok.indexOf(k) >= 0 ? win() : fail(); };
        opts.append(b);
      });
      box.append(opts);
    };
  }

  function catchLevel(n) {            // несколько плавающих сердечек, нажать на все
    return function (box, win) {
      var area = el("div", "area"), left = n, info = el("p", "count", "Осталось: " + n), timers = [];
      box.append(area, info);
      function place(h) { h.style.left = rand(2, 82) + "%"; h.style.top = rand(2, 78) + "%"; }
      for (var i = 0; i < n; i++) (function () {
        var h = el("button", "fh", "♥"); h.style.fontSize = "44px"; place(h); area.append(h);
        var tm = setInterval(function () { place(h); }, 1300); timers.push(tm);
        h.onclick = function () { clearInterval(tm); h.remove(); burst(lastX, lastY); left--; info.textContent = "Осталось: " + left; if (!left) win(); };
      })();
      return function () { timers.forEach(clearInterval); };
    };
  }

  function chaseLevel(taps) {         // одно быстрое сердечко
    return function (box, win) {
      var area = el("div", "area"), got = 0, info = el("p", "count", "Поймано: 0 из " + taps);
      var h = el("button", "fh", "♥"); h.style.fontSize = "38px"; h.style.transition = "left .3s, top .3s";
      function place() { h.style.left = rand(2, 84) + "%"; h.style.top = rand(2, 80) + "%"; }
      place(); area.append(h); box.append(area, info);
      var tm = setInterval(place, 800);
      h.onclick = function () { got++; info.textContent = "Поймано: " + got + " из " + taps; burst(lastX, lastY); if (got >= taps) { clearInterval(tm); h.remove(); win(); } else place(); };
      return function () { clearInterval(tm); };
    };
  }

  function daysLevel() {
    return function (box, win, fail, hint) {
      var inp = el("input", "num"), go = el("button", "main", "Ответить");
      inp.type = "text"; inp.inputMode = "numeric"; inp.placeholder = "Введи число дней";
      inp.setAttribute("aria-label", "Количество дней");
      function submit() {
        var v = inp.value.trim(), n = Number(v), d = daysTogether();
        if (v !== "" && (n === d || n === d + 1)) win();     // принимаем счёт с первым днём и без него
        else if (fail() >= 2) hint.textContent = "Подсказка: мы вместе с " + fmtDate(startDate()) + " 😉";
      }
      go.onclick = submit;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      box.append(inp, go);
    };
  }

  function memoryLevel() {
    return function (box, win) {
      var sym = ["❤️", "🌹", "💋", "🧸"], cards = shuffle(sym.concat(sym)), grid = el("div", "grid");
      var open = [], matched = 0, lock = false, tms = [];
      cards.forEach(function (s) {
        var b = el("button", "mc");
        b.setAttribute("aria-label", "Карточка");
        b.onclick = function () {
          if (lock || b.classList.contains("up")) return;
          b.textContent = s; b.classList.add("up"); open.push({ b: b, s: s });
          if (open.length < 2) return;
          lock = true;
          if (open[0].s === open[1].s) { matched++; open = []; lock = false; if (matched === sym.length) win(); }
          else tms.push(setTimeout(function () { open.forEach(function (o) { o.b.textContent = ""; o.b.classList.remove("up"); }); open = []; lock = false; }, 700));
        };
        grid.append(b);
      });
      box.append(grid);
      return function () { tms.forEach(clearTimeout); };
    };
  }

  function starLevel(n) {
    return function (box, win) {
      var c = 0, b = el("button", "big", "⭐"), info = el("p", "count", "0 из " + n);
      b.setAttribute("aria-label", "Звезда");
      b.onclick = function () { c++; info.textContent = c + " из " + n; vib(10); if (c >= n) win(); };
      box.append(b, info);
    };
  }

  function dateLevel() {
    return function (box, win, fail) {
      var s = startDate(), opts = el("div", "opts");
      function shift(days) { var d = new Date(s); d.setDate(d.getDate() + days); return d; }
      var list = shuffle([{ d: s, ok: true }, { d: shift(Math.round(rand(7, 25))), ok: false }, { d: shift(-Math.round(rand(20, 70))), ok: false }]);
      list.forEach(function (o) {
        var b = el("button", "opt", fmtDate(o.d));
        b.onclick = function () { o.ok ? win() : fail(); };
        opts.append(b);
      });
      box.append(opts);
    };
  }

  function sliderLevel() {
    return function (box, win) {
      var sl = el("input"), done = false;
      sl.type = "range"; sl.min = 0; sl.max = 100; sl.value = 0;
      sl.setAttribute("aria-label", "Проведи до конца");
      sl.addEventListener("input", function () { if (+sl.value >= 99 && !done) { done = true; sl.value = 100; win(); } });
      sl.addEventListener("change", function () { if (!done) sl.value = 0; });
      box.append(sl, el("p", "count", "Доведи до конца 🤗"));
    };
  }

  function holdLevel(sec) {
    return function (box, win) {
      var b = el("button", "holdbtn", "Держи"), bar = el("div", "bar"), fill = el("i"), start = 0, raf = 0, done = false;
      bar.append(fill); box.append(bar, b, el("p", "count", "Не отпускай " + sec + " секунды"));
      function tick() {
        var p = Math.min((performance.now() - start) / (sec * 1000), 1);
        fill.style.width = p * 100 + "%";
        if (p >= 1) { done = true; vib(40); win(); return; }
        raf = requestAnimationFrame(tick);
      }
      function stop() { cancelAnimationFrame(raf); b.classList.remove("on"); if (!done) fill.style.width = "0%"; }
      b.addEventListener("pointerdown", function (e) { e.preventDefault(); if (done) return; start = performance.now(); b.classList.add("on"); tick(); });
      ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { b.addEventListener(ev, stop); });
      b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      return function () { cancelAnimationFrame(raf); };
    };
  }

  var LEVELS = [
    { t: "Поймай сердечки", d: "Нажми на все 5 сердечек, пока они не уплыли.", run: catchLevel(5) },
    { t: "Ты меня любишь?", d: "Простой вопрос. Ответ только один.", run: choiceLevel(["Да", "Очень сильно", "Нет"], [0, 1], [2]) },
    { t: "Сколько дней мы вместе?", d: "Введи число дней.", run: daysLevel() },
    { t: "Найди пары", d: "Открой карточки и найди все пары.", run: memoryLevel() },
    { t: "Звёздный тап", d: "Нажми на звезду 10 раз.", run: starLevel(10) },
    { t: "Лови сердце", d: "Оно убегает, но ты быстрее. Поймай 3 раза.", run: chaseLevel(3) },
    { t: "Наша дата", d: "Выбери день, когда всё началось.", run: dateLevel() },
    { t: "Обними меня", d: "Проведи ползунок до конца.", run: sliderLevel() },
    { t: "Держи крепко", d: "Зажми кнопку и не отпускай.", run: holdLevel(3) },
    { t: "Последний вопрос", d: "Кто самая красивая девушка на свете?", run: choiceLevel(["Я", "Конечно я", "Не я"], [0, 1], [2]) }
  ];

  // ===== Экраны =====
  function intro() {
    clear();
    var card = el("div", "card");
    card.append(el("h1", "", "Привет, " + CONFIG.name + " ❤"));
    card.append(el("p", "", "Это маленькая игра: 10 простых уровней. Пройдёшь все, и тебя ждёт сюрприз. Предупреждаю заранее: ошибки не принимаются."));
    var b = el("button", "main", "Играть");
    b.onclick = function () { play(0); };
    card.append(b);
    app.append(card);
  }

  function play(i) {
    clear();
    var L = LEVELS[i], tries = 0, done = false;
    var card = el("div", "card"), hud = el("div", "hud"), dots = el("div", "dots");
    for (var k = 0; k < LEVELS.length; k++) dots.append(el("span", k <= i ? "on" : "", "♥"));
    hud.append(el("span", "", "Уровень " + (i + 1) + " из " + LEVELS.length), dots);
    var box = el("div"), err = el("p", "err"), hint = el("p", "hint");
    err.setAttribute("role", "alert");
    card.append(hud, el("h1", "", L.t), el("p", "", L.d), box, err, hint);
    app.append(card);

    function win() {
      if (done) return;
      done = true; err.textContent = ""; burst(lastX, lastY);
      card.append(el("p", "ok", i + 1 < LEVELS.length ? "Уровень пройден! ❤" : "Все уровни пройдены! ❤"));
      setTimeout(function () { i + 1 < LEVELS.length ? play(i + 1) : finale(); }, 900);
    }
    function fail() {
      if (done) return tries;
      err.textContent = ERRORS[tries % ERRORS.length]; tries++;
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      vib(60);
      return tries;
    }
    cleanup = L.run(box, win, fail, hint) || null;
  }

  // Форма сердца: параметрическая кривая
  function heartPath() {
    var d = "";
    for (var a = 0; a <= 6.2832; a += 0.05) {
      var x = 16 * Math.pow(Math.sin(a), 3);
      var y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
      d += (d ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }
    return d + "Z";
  }

  function finale() {
    clear();
    document.body.classList.add("night");
    var d = heartPath(), wrap = el("div", "neon"), hw = el("div", "hw");
    // Сердце «рисуется» неоновой линией, затем мигает как неоновая вывеска и начинает светиться
    hw.innerHTML =
      '<svg viewBox="-21 -17 42 38" aria-hidden="true"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter></defs>' +
      '<path class="fillh" d="' + d + '"/>' +
      '<g><path class="glow" pathLength="1" filter="url(#gl)" d="' + d + '"/><path class="core" pathLength="1" d="' + d + '"/></g>' +
      '<g transform="translate(0 2.5) scale(.78) translate(0 -2.5)" opacity=".75"><path class="glow e2" pathLength="1" filter="url(#gl)" d="' + d + '"/><path class="core e2" pathLength="1" d="' + d + '"/></g></svg>';
    wrap.append(hw);

    var lines = CONFIG.words.slice();
    lines.splice(2, 0, "Мы вместе уже " + (daysTogether() + 1) + " дней.");
    lines.push("Я люблю тебя, " + CONFIG.name + " ❤");
    lines.forEach(function (text, n) {
      var p = el("p", "wd" + (n === lines.length - 1 ? " last" : ""), text);
      p.style.animationDelay = (4.2 + n * 1.3) + "s";
      wrap.append(p);
    });
    var again = el("button", "link", "Пройти ещё раз");
    again.style.opacity = "0";
    again.style.animation = "rise 1s ease forwards";
    again.style.animationDelay = (4.2 + lines.length * 1.3 + 1) + "s";
    again.onclick = intro;
    wrap.append(again);
    app.append(wrap);
  }

  // Фоновые плывущие сердечки
  function floatHeart() {
    var h = el("span", "fl", "♥");
    h.style.left = rand(0, 100) + "vw"; h.style.fontSize = rand(12, 34) + "px";
    h.style.color = PALETTE[(Math.random() * PALETTE.length) | 0];
    h.style.animationDuration = rand(7, 13) + "s";
    h.addEventListener("animationend", function () { h.remove(); });
    document.body.appendChild(h);
  }
  setInterval(floatHeart, 1300);

  intro();
</script>
</body>
</html>
